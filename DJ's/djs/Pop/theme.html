<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POP SESSION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0010;}
body{font-family:'Outfit',sans-serif;}

/* ── LIQUID GRADIENT BG ────────────────────────────────── */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ── IDLE ─────────────────────────────────────────────── */
#idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:32px;z-index:100;
  transition:opacity 1.6s,visibility 1.6s;}
#idle.off{opacity:0;visibility:hidden;pointer-events:none}

.idle-glass{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:32px;
  padding:48px 64px;
  display:flex;flex-direction:column;align-items:center;gap:28px;
  box-shadow:0 8px 64px rgba(255,100,200,0.15),0 2px 16px rgba(0,0,0,0.4);}

.idle-logo{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(52px,10vw,110px);letter-spacing:12px;
  background:linear-gradient(135deg,#ff6ec7 0%,#a78bfa 40%,#67e8f9 80%,#fde68a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:logopulse 5s ease-in-out infinite;}
@keyframes logopulse{
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,110,199,0.6)) drop-shadow(0 0 60px rgba(167,139,250,0.3));}
  50%{filter:drop-shadow(0 0 40px rgba(103,232,249,0.8)) drop-shadow(0 0 100px rgba(255,110,199,0.4));}}

.idle-sub{font-family:'Outfit',sans-serif;font-weight:300;font-size:11px;letter-spacing:6px;
  color:rgba(255,255,255,0.45);text-transform:uppercase;}

.play-btn{width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,110,199,0.2),rgba(167,139,250,0.2));
  border:1.5px solid rgba(255,255,255,0.3);
  backdrop-filter:blur(8px);
  cursor:pointer;font-size:28px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(255,110,199,0.3),inset 0 0 20px rgba(255,255,255,0.05);
  transition:all .4s;position:relative;}
.play-btn::before{content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(255,110,199,0.25);animation:ringgrow 3s ease-out infinite;}
.play-btn::after{content:'';position:absolute;inset:-18px;border-radius:50%;
  border:1px solid rgba(103,232,249,0.15);animation:ringgrow 3s ease-out 0.8s infinite;}
@keyframes ringgrow{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.play-btn:hover{
  background:linear-gradient(135deg,rgba(255,110,199,0.35),rgba(167,139,250,0.35));
  box-shadow:0 0 80px rgba(255,110,199,0.6),inset 0 0 40px rgba(255,255,255,0.1);
  transform:scale(1.06);}
.play-btn:disabled{opacity:.2;cursor:not-allowed;}
.play-btn:disabled::before,.play-btn:disabled::after{display:none}

.idle-info{font-family:'Outfit',sans-serif;font-size:12px;color:rgba(255,255,255,0.3);}
.idle-info b{color:rgba(255,200,240,0.8)}

/* ── STAGE ─────────────────────────────────────────────── */
#stage{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 2s;background:transparent;}
#stage.on{opacity:1;}

#vizMain{position:absolute;inset:0;width:100%;height:100%;}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* ── HUD ─────────────────────────────────────────────── */
#hud{position:absolute;bottom:0;left:0;right:0;
  padding:0 48px 48px;
  display:flex;align-items:flex-end;justify-content:space-between;
  pointer-events:none;z-index:10;}
#hud::before{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(5,0,18,0.88) 0%,rgba(5,0,18,0.3) 55%,transparent 100%);
  pointer-events:none;}

.hud-left{position:relative;z-index:1;max-width:72%;}

.hud-label{
  font-family:'Outfit',sans-serif;font-weight:300;font-size:9px;letter-spacing:6px;
  text-transform:uppercase;color:rgba(255,110,199,0.6);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;}
.hud-label::before{content:'';width:20px;height:1px;background:rgba(255,110,199,0.4);}

#npTitle{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(26px,4vw,62px);line-height:1.05;
  color:#fff;
  text-shadow:0 0 40px rgba(255,110,199,0.4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:text-shadow .1s, opacity .5s;
  opacity:0;
  animation:titleIn .8s ease forwards;}
@keyframes titleIn{0%{opacity:0;filter:blur(8px);transform:translateY(6px)}100%{opacity:1;filter:blur(0);transform:translateY(0)}}
#npTitle.beat-pulse{text-shadow:0 0 60px rgba(255,110,199,1),0 0 120px rgba(167,139,250,0.7);}

.hud-meta{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;}

.hud-bpm{
  font-family:'Outfit',sans-serif;font-weight:600;font-size:11px;letter-spacing:2px;
  color:rgba(255,110,199,0.9);}

.hud-key{
  font-family:'Outfit',sans-serif;font-weight:400;font-size:10px;
  color:rgba(103,232,249,0.9);
  padding:3px 10px;
  border:1px solid rgba(103,232,249,0.25);
  border-radius:20px;
  background:rgba(103,232,249,0.06);}

.hud-dur{font-family:'Outfit',sans-serif;font-size:10px;color:rgba(255,255,255,0.2);}

.hud-estilo{
  font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(253,230,138,0.9);
  padding:3px 10px;border:1px solid rgba(253,230,138,0.25);border-radius:20px;
  background:rgba(253,230,138,0.06);}

/* Mode indicator (visual mode label) */
#modeLabel{
  position:absolute;top:32px;left:50%;transform:translateX(-50%);
  font-family:'Outfit',sans-serif;font-weight:300;font-size:9px;letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,0.25);
  pointer-events:none;z-index:10;
  transition:opacity 1s;}

/* Like buttons */
#likeRow{display:flex;gap:8px;align-items:center;}
.like-btn{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.12);border-radius:50%;
  width:36px;height:36px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;pointer-events:all;}
.like-btn:hover{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.1);transform:scale(1.12);}
.like-btn.active-like{border-color:rgba(80,220,120,.6);background:rgba(80,220,120,.12);
  box-shadow:0 0 16px rgba(80,220,120,.3);}
.like-btn.active-dislike{border-color:rgba(255,80,80,.6);background:rgba(255,80,80,.12);
  box-shadow:0 0 16px rgba(255,80,80,.3);}

.hud-right{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}

/* Phase pill */
#phasePill{
  font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:4px;
  text-transform:uppercase;padding:5px 16px;border-radius:20px;border:1px solid;
  backdrop-filter:blur(8px);transition:all .8s;}
.pill-warm-up{color:rgba(103,232,249,.9);border-color:rgba(103,232,249,.3);background:rgba(103,232,249,.06)}
.pill-first-build{color:rgba(167,139,250,.9);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08)}
.pill-first-peak{color:#fff;border-color:rgba(255,110,199,.6);background:rgba(255,110,199,.12);
  animation:peakglow 1.2s ease-in-out infinite}
.pill-breakdown{color:rgba(103,232,249,.9);border-color:rgba(103,232,249,.3);background:rgba(103,232,249,.05)}
.pill-second-build{color:rgba(167,139,250,.9);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08)}
.pill-second-peak{color:#fff;border-color:rgba(255,110,199,.7);background:rgba(255,110,199,.15);
  animation:peakglow .8s ease-in-out infinite}
.pill-outro{color:rgba(255,255,255,.2);border-color:rgba(255,255,255,.1);background:transparent}
@keyframes peakglow{
  0%,100%{box-shadow:none}
  50%{box-shadow:0 0 28px rgba(255,110,199,.6),0 0 60px rgba(167,139,250,.3)}}

/* Mix indicator */
#mixIndicator{
  font-family:'Outfit',sans-serif;font-size:8px;letter-spacing:3px;
  text-transform:uppercase;padding:5px 16px;border-radius:20px;
  display:none;align-items:center;gap:8px;
  color:rgba(103,232,249,.9);border:1px solid rgba(103,232,249,.3);
  background:rgba(103,232,249,.06);backdrop-filter:blur(8px);}
#mixIndicator.on{display:flex;}
.mix-dot-ind{width:5px;height:5px;border-radius:50%;background:currentColor;
  animation:blink .5s step-end infinite;}
@keyframes blink{50%{opacity:0}}

/* Progress bar — purely decorative, 2px, no pointer events */
#progressBar{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:rgba(255,255,255,0.05);
  pointer-events:none;z-index:20;overflow:hidden;}
#progressFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,rgba(255,110,199,0.7),rgba(167,139,250,0.7),rgba(103,232,249,0.7));
  transition:width .5s linear;}

/* Invisible compat elements */
.beat-dot{display:none}
#app,#tlWrap{display:none!important}
#eqRow,#mixRow,#nxtRow,#ww,#wc,#ph,#phHandle{display:none!important}
#viz{position:absolute;left:-9999px;opacity:0;width:1px;height:1px;}
</style>
</head>
<body>

<!-- LIQUID BACKGROUND -->
<canvas id="bgCanvas"></canvas>

<!-- IDLE -->
<div id="idle">
  <div class="idle-glass">
    <div class="idle-logo">POP</div>
    <div class="idle-sub">AI DJ · Sesión autónoma</div>
    <button class="play-btn" id="btnStart" disabled>▶</button>
    <div class="idle-info" id="idleInfo">Cargando biblioteca...</div>
  </div>
</div>

<!-- STAGE -->
<div id="stage">
  <canvas id="vizMain"></canvas>
  <canvas id="particles"></canvas>
  <div id="modeLabel" id="modeLabel">— SPHERES —</div>
  <div id="hud">
    <div class="hud-left">
      <div class="hud-label">Now Playing</div>
      <div id="npTitle">—</div>
      <div class="hud-meta">
        <span class="hud-bpm" id="npBpm"></span>
        <span class="hud-key" id="npKey" style="display:none"></span>
        <span class="hud-estilo" id="npEstilo" style="display:none"></span>
        <span class="hud-dur" id="npDur"></span>
      </div>
    </div>
    <div class="hud-right">
      <div id="phasePill" class="pill-warm-up">WARM</div>
      <div id="mixIndicator"><div class="mix-dot-ind"></div><span id="mixLabel">MIX</span></div>

        <button class="like-btn" id="btnLike" onclick="sendLike('like')" title="Me gusta">👍</button>

      </div>

</div>

<!-- INVISIBLE COMPAT -->
<div id="app" style="display:none">

  <div class="card">
    <div class="np">
      <div id="vinyl"></div>
      <div class="np-info">
        <div id="npTitleHidden">—</div>
        <div class="np-meta">
          <span id="npBpmHidden">—</span>
          <span id="npEgy">—</span>
          <span id="npKeyHidden">—</span>
          <span id="npDurHidden">—</span>
          <span id="phasePillHidden">warm-up</span>
        </div>
      </div>
    </div>
    <div id="ww" style="display:none">
      <canvas id="wc"></canvas>
      <div id="ph"><div id="phHandle"></div></div>
      <div id="wwTooltip">0:00</div>
      <div class="times"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
    </div>
    <div id="eqRow">
      <div><div id="eqLo" style="width:100%"></div></div>
      <div><div id="eqMid" style="width:100%"></div></div>
      <div><div id="eqHi" style="width:100%"></div></div>

      <div><div id="arcCursor" style="left:0%"></div></div>

      <div id="mixStyleLabel">⚡</div>
      <div><div id="mixFill"></div></div>
      <div id="mixInfo">mezclando...</div>
    </div>
    <div id="nxtRow">
      <div id="nxtNm">—</div>
      <div id="nxtSc">—</div>
      <div id="nxtT">—</div>
      <button id="btnCue" disabled></button>
    </div>
    <div>
      <div><div id="bpmVal">—</div></div>
      <div id="beatDot"></div>
      <div id="modB">—</div>
      <button id="btnSkip" disabled></button>
      <div id="log">—</div>
    </div>
  </div>
  <div id="tlWrap">
    <canvas id="tlCurve"></canvas>
    <div id="tlBlocks"></div>
    <div id="tlHead" style="left:0%"></div>
    <div id="tlLabels"></div>
    <span id="tlDur">—</span>
  </div>
  <div class="lib">

</div>

<script>
// ════════════════════════════════════════════════════════════════
//  DJ AI · Audio Engine (lógica Python intacta)
// ════════════════════════════════════════════════════════════════
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null;

const PHASE_ORDER = ['warm-up','first-build','first-peak','breakdown','second-build','second-peak','outro'];
const PHASE_LABELS = {'warm-up':'WARM','first-build':'BUILD','first-peak':'PEAK 1',
  'breakdown':'DOWN','second-build':'BUILD 2','second-peak':'PEAK 2','outro':'OUTRO'};
const STYLE_LABELS = { guetta: '⚡ GUETTA', avicii: '🌅 AVICII', progressive: '〰 PROG', fusion: '✦ FUSION' };
const STYLE_ICONS  = { guetta: '⚡', avicii: '🌅', progressive: '〰' };

const S = {
  lib: [], cur: null, curFile: null,
  nxt: null, nxtPlan: null, nxtScore: 0, nxtPhase: 'warm-up',
  played: [], playedSet: new Set(), count: 0,
  playing: false, mixing: false,
  mixStart: 0, mixDur: 8,
  deck: 'A',
  startAt: 0,
  bufs: {},
  decks: { A: {}, B: {} },
  modOk: false,
  silenceStart: null,
  lastRms: 1.0,
  silenceTriggered: false,
  beatLastTime: 0,
  beatThresh: 0.15,
  beatHistory: [],
  lastBpm: 0,
  sessionTracks: [],
  sessionStartTime: 0,
  _beatSnapScheduled: false,
  cueing: false,
  cueSrc: null,
  cueGain: null,
};

// ── Init ──────────────────────────────────────────────────────
function ic() {
  if (!ctx) {
    ctx = new AC();
    S.comp = ctx.createDynamicsCompressor();
    S.comp.threshold.value = -14;
    S.comp.knee.value      = 6;
    S.comp.ratio.value     = 4;
    S.comp.attack.value    = 0.003;
    S.comp.release.value   = 0.25;
    S.mAnl = ctx.createAnalyser();
    S.mAnl.fftSize = 1024;
    S.comp.connect(S.mAnl);
    S.mAnl.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();

  if (!S.reverb) {
    S.reverb    = ctx.createConvolver();
    S.reverbGain = ctx.createGain();
    S.reverbGain.gain.value = 0;
    const rate = ctx.sampleRate;
    const len  = Math.floor(rate * 2.5);
    const ir   = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/len, 2.5);
    }
    S.reverb.buffer = ir;
    S.comp.connect(S.reverbGain);
    S.reverbGain.connect(S.reverb);
    S.reverb.connect(ctx.destination);
  }
  if (!S.cueOutGain) {
    S.cueOutGain = ctx.createGain();
    S.cueOutGain.gain.value = 0.85;
    S.cueOutGain.connect(ctx.destination);
  }
}

// ── Boot ──────────────────────────────────────────────────────
async function boot() {
  const [lr, mr] = await Promise.all([fetch('/api/library'), fetch('/api/modules')]);
  S.lib  = await lr.json();
  const m = await mr.json();
  S.modOk = m.ok;
  await loadPrefs();
  document.getElementById('modB').textContent = S.modOk ? 'MÓDULOS OK' : 'FALLBACK';
  document.getElementById('libCount').textContent = S.lib.length + ' canciones';
  document.getElementById('idleInfo').innerHTML =
    `<b>${S.lib.length}</b> canción${S.lib.length!==1?'es':''} · arco automático`;
  document.getElementById('btnStart').disabled = S.lib.length === 0;
  if (!S.lib.length)
    document.getElementById('idleInfo').textContent = 'Pon MP3/WAV en musica/canciones/';
  renderLib();
  initBgCanvas();
}

// ── Scrubbing block (invisible, compat JS — sin interacción real) ──
{
  const ww = document.getElementById('ww');
  const ph = document.getElementById('ph');
  const handle = document.getElementById('phHandle');
  const tooltip = document.getElementById('wwTooltip');
  let dragging = false;
  function scrubPos(e) {
    const rect = ww.getBoundingClientRect();
    const pad = 18;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - pad;
    const w = rect.width - pad * 2;
    return Math.max(0, Math.min(1, x / w));
  }
  function seekTo(frac) {
    const dur = S.cur ? (S.cur.duracion_segundos || 0) : 0;
    if (!dur || !S.playing || !ctx) return;
    const newTime = frac * dur;
    const dk = S.deck;
    const trk = S.cur;
    if (!trk || !S.bufs[trk.file]) return;
    const d = S.decks[dk];
    if (d.src) { d.src.onended = null; try { d.src.stop(); } catch(e) {} d.src = null; }
    const src = ctx.createBufferSource();
    src.buffer = S.bufs[trk.file];
    src.playbackRate.value = 1.0;
    src.connect(d.preGain);
    src.start(0, newTime);
    d.src = src; d.startedAt = ctx.currentTime - newTime;
    S.startAt = d.startedAt;
    S.silenceStart = null; S.silenceTriggered = false;
    src.onended = () => { if (S.playing && dk === S.deck && !S.mixing) doMix(); };
  }
  function onMove(e) {
    if (!S.playing) return; e.preventDefault();
    const frac = scrubPos(e);
    const dur = S.cur ? (S.cur.duracion_segundos || 0) : 0;
    const wc = document.getElementById('wc');
    const w = wc.offsetWidth;
    ph.style.left = (18 + frac * w) + 'px';
    const t = frac * dur;
    tooltip.textContent = fmt(t);
    tooltip.style.left = (18 + frac * w) + 'px';
    tooltip.classList.add('show');
    if (dragging) document.getElementById('tCur').textContent = fmt(t);
  }
  function onDown(e) {
    if (!S.playing || S.mixing) return;
    dragging = true; ph.classList.add('scrubbing'); handle.classList.add('scrubbing'); onMove(e);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false; ph.classList.remove('scrubbing'); handle.classList.remove('scrubbing');
    tooltip.classList.remove('show');
    const frac = scrubPos(e.changedTouches ? {clientX: e.changedTouches[0].clientX} : e);
    seekTo(frac);
  }
  ww.addEventListener('mousedown', onDown);
  ww.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', e => { if (dragging) onMove(e); });
  window.addEventListener('touchmove', e => { if (dragging) onMove(e); }, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
  ww.addEventListener('mousemove', e => { if (!dragging && S.playing) onMove(e); });
  ww.addEventListener('mouseleave', () => { if (!dragging) tooltip.classList.remove('show'); });
  S._dragging = () => dragging;
}

// ── Start ──────────────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click', async () => {
  ic();
  document.getElementById('idle').classList.add('off');
  document.getElementById('stage').classList.add('on');
  initPopVisuals();
  const first = chooseFirst();
  await begin(first);
});

function chooseFirst() {
  if (!S.lib.length) return null;
  const s = [...S.lib].sort((a,b)=>(a.energia||50)-(b.energia||50));
  return s[Math.floor(s.length * 0.18)] || s[0];
}

async function begin(t) {
  S.cur = t; S.curFile = t.file; S.deck = 'A';
  S.playing = true; S.startAt = 0;
  S.played.push(t.file); S.playedSet.add(t.file); S.count = 1;
  S.sessionStartTime = ctx.currentTime;
  S.sessionTracks = [{ track: t, startCtxTime: ctx.currentTime, color: trackColor(0) }];
  updateNP(t, 'warm-up');
  const startPos = t.start_position ?? 0;
  await playDeck('A', t, startPos);
  logMsg(`Iniciando desde ${fmt(startPos)}: ${t.name}`);
  document.getElementById('btnSkip').disabled = false;
  renderLib();
  renderTimeline();
  loop();
  askNext(t, 0);
}

document.getElementById('btnSkip').addEventListener('click', () => {
  if (!S.mixing && S.playing) doMix();
});

document.getElementById('btnCue').addEventListener('click', async () => {
  if (!S.nxt) return;
  const btn = document.getElementById('btnCue');
  if (S.cueing) {
    if (S.cueSrc) { try{S.cueSrc.stop();}catch(e){} S.cueSrc = null; }
    if (S.cueGain) { S.cueGain.gain.setValueAtTime(0, ctx.currentTime); }
    S.cueing = false; btn.classList.remove('cueing'); btn.textContent = '👂 CUE'; return;
  }
  try {
    const buf = await loadBuf(S.nxt);
    const enterAt = S.nxtPlan ? (S.nxtPlan.start_next_time || 0) : 0;
    const CUE_DUR = 8;
    S.cueGain = ctx.createGain();
    S.cueGain.gain.setValueAtTime(0, ctx.currentTime);
    S.cueGain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.3);
    S.cueGain.connect(S.cueOutGain);
    S.cueSrc = ctx.createBufferSource();
    S.cueSrc.buffer = buf;
    S.cueSrc.connect(S.cueGain);
    S.cueSrc.start(0, enterAt);
    S.cueGain.gain.setValueAtTime(0.6, ctx.currentTime + CUE_DUR - 1);
    S.cueGain.gain.linearRampToValueAtTime(0, ctx.currentTime + CUE_DUR);
    S.cueSrc.stop(ctx.currentTime + CUE_DUR);
    S.cueSrc.onended = () => {
      S.cueing = false; btn.classList.remove('cueing'); btn.textContent = '👂 CUE'; S.cueSrc = null;
    };
    S.cueing = true; btn.classList.add('cueing'); btn.textContent = '■ STOP';
    logMsg(`👂 Preview: ${S.nxt.name}`);
  } catch(e) { logMsg('Error cargando preview'); }
});

async function askNext(t, ct) {
  if (!t) return;
  try {
    const pe  = encodeURIComponent(JSON.stringify([...S.playedSet]));
    const pl  = encodeURIComponent(JSON.stringify(
      S.played.slice(-3).map(f => ({ file: f, key: (S.lib.find(x=>x.file===f)||{}).key||'' }))
    ));
    const url = `/api/next?current=${encodeURIComponent(t.file)}&time=${ct.toFixed(1)}&played=${pe}&count=${S.count}&played_list=${pl}`;
    const d   = await (await fetch(url)).json();
    if (d.error) { S.nxt = null; hideNext(); return; }
    S.nxt = d.track; S.nxtPlan = d.plan; S.nxtScore = d.score; S.nxtPhase = d.phase;
    showNext(d.track, d.plan, d.score, d.phase);
    updateArc(d.phase, d.target_energy);
    preload(d.track);
    renderLib();
  } catch(e) {}
}

async function loadBuf(t) {
  if (S.bufs[t.file]) return S.bufs[t.file];
  ic();
  const ab  = await (await fetch('/audio/'+encodeURIComponent(t.file))).arrayBuffer();
  const buf = await ctx.decodeAudioData(ab);
  return S.bufs[t.file] = buf;
}
async function preload(t) {
  if (!t || S.bufs[t.file]) return;
  try { ic(); await loadBuf(t); } catch(e) {}
}

function resetGraph(dk) {
  const d = S.decks[dk];
  if (d.src) { try{d.src.stop();}catch(e){} d.src = null; }
  d.preGain  = ctx.createGain();
  d.hipass   = ctx.createBiquadFilter();
  d.lopass   = ctx.createBiquadFilter();
  d.analyser = ctx.createAnalyser();
  d.analyser.fftSize = 256;
  d.hipass.type = 'highpass'; d.hipass.Q.value = 0.71;
  d.lopass.type = 'lowpass';  d.lopass.Q.value = 0.71;
  d.preGain.connect(d.hipass);
  d.hipass.connect(d.lopass);
  d.lopass.connect(d.analyser);
  d.analyser.connect(S.comp);
  return d;
}

async function playDeck(dk, track, offset = 0) {
  const buf = await loadBuf(track);
  if (!track.duracion_segundos || track.duracion_segundos === 0)
    track.duracion_segundos = buf.duration;
  const d = resetGraph(dk);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  if (dk !== S.deck && track.bpm && S.cur && S.cur.bpm && track.bpm > 0) {
    const ratio = S.cur.bpm / track.bpm;
    src.playbackRate.setValueAtTime(ratio, ctx.currentTime);
    d._bpmRatio = ratio; d._bpmTarget = 1.0;
  } else { src.playbackRate.value = 1.0; d._bpmRatio = 1.0; d._bpmTarget = 1.0; }
  src.connect(d.preGain);
  d.preGain.gain.setValueAtTime(dk === S.deck ? 1 : 0, ctx.currentTime);
  d.hipass.frequency.setValueAtTime(dk === S.deck ? 20 : 320, ctx.currentTime);
  d.lopass.frequency.setValueAtTime(20000, ctx.currentTime);
  src.start(0, offset);
  d.src = src;
  d.startedAt = ctx.currentTime - offset;
  if (dk === S.deck) { S.startAt = d.startedAt; drawWave(buf, track); }
  src.onended = () => { if (S.playing && dk === S.deck && !S.mixing) doMix(); };
}

function getTime() {
  return !S.playing || !ctx ? 0 : Math.max(0, ctx.currentTime - S.startAt);
}

async function doMix() {
  if (S.mixing || !S.playing) return;
  const nxt = S.nxt;
  if (!nxt) { askNext(S.cur, getTime()); setTimeout(() => { if (!S.mixing && S.nxt) doMix(); }, 1200); return; }
  const plan  = S.nxtPlan;
  const cfDur = plan ? (plan.mix_duration || 8) : 8;
  const enterAt = plan ? (plan.start_next_time || 0) : 0;
  const style   = plan ? (plan.style || 'guetta') : 'guetta';
  if (S.cueing && S.cueSrc) {
    try { S.cueSrc.stop(); } catch(e) {}
    S.cueSrc = null; S.cueing = false;
    document.getElementById('btnCue').classList.remove('cueing');
    document.getElementById('btnCue').textContent = '👂 CUE';
  }
  S.mixing = true; S.mixStart = ctx.currentTime; S.mixDur = cfDur; S.mixStyle = style;
  showMixing(nxt.name, cfDur, style);
  logMsg(`${STYLE_LABELS[style]||style} · ⇄ ${nxt.name} · ${cfDur.toFixed(0)}s`);
  if (S.reverb && S.reverbGain) {
    const rp = style==='avicii'?.35:style==='progressive'?.10:style==='fusion'?.22:.18;
    const rg = S.reverbGain.gain;
    rg.cancelScheduledValues(ctx.currentTime); rg.setValueAtTime(0, ctx.currentTime);
    rg.linearRampToValueAtTime(rp, ctx.currentTime + cfDur * 0.25);
    rg.linearRampToValueAtTime(rp*0.5, ctx.currentTime + cfDur * 0.75);
    rg.linearRampToValueAtTime(0, ctx.currentTime + cfDur);
  }
  const out = S.deck;
  const inp = out === 'A' ? 'B' : 'A';
  await playDeck(inp, nxt, enterAt);
  const t0 = ctx.currentTime;
  const dOut = S.decks[out]; const dIn = S.decks[inp];
  const steps = Math.round(cfDur * 30);
  dOut.preGain.gain.cancelScheduledValues(t0); dIn.preGain.gain.cancelScheduledValues(t0);
  dOut.hipass.frequency.cancelScheduledValues(t0); dOut.lopass.frequency.cancelScheduledValues(t0);
  dIn.hipass.frequency.cancelScheduledValues(t0); dIn.lopass.frequency.cancelScheduledValues(t0);
  dOut.preGain.gain.setValueAtTime(1, t0); dIn.preGain.gain.setValueAtTime(0, t0);
  dOut.lopass.frequency.setValueAtTime(20000, t0); dOut.hipass.frequency.setValueAtTime(20, t0);
  dIn.lopass.frequency.setValueAtTime(20000, t0);
  if (style==='progressive'||style==='avicii'||style==='fusion') dIn.hipass.frequency.setValueAtTime(20, t0);
  else dIn.hipass.frequency.setValueAtTime(320, t0);
  if (style!=='progressive' && dIn.src && dIn._bpmRatio && dIn._bpmRatio!==1.0) {
    dIn.src.playbackRate.cancelScheduledValues(t0);
    dIn.src.playbackRate.setValueAtTime(dIn._bpmRatio, t0);
    dIn.src.playbackRate.exponentialRampToValueAtTime(1.0, t0 + cfDur);
  }
  if (!S.compGain) {
    S.compGain = ctx.createGain(); S.compGain.gain.value = 1;
    S.comp.disconnect(S.mAnl); S.comp.connect(S.compGain); S.compGain.connect(S.mAnl);
  }
  S.compGain.gain.cancelScheduledValues(t0); S.compGain.gain.setValueAtTime(1, t0);
  for (let i = 0; i <= steps; i++) {
    const f = i / steps;
    const tAt = t0 + f * cfDur;
    let vOut, vIn;
    if (style==='progressive') { vOut=Math.cos(f*Math.PI/2); vIn=Math.sin(f*Math.PI/2); }
    else if (style==='fusion') {
      if(f<0.20){vOut=1;vIn=Math.sin((f/0.20)*Math.PI/2);}
      else if(f<0.80){const mid=(f-0.20)/0.60;vOut=Math.cos(mid*Math.PI/2)*0.3+0.7;vIn=Math.sin(mid*Math.PI/2)*0.3+0.7;}
      else{const tail=(f-0.80)/0.20;vOut=Math.cos(tail*Math.PI/2)*0.7;vIn=1.0;}
    } else if (style==='avicii') {
      vOut=Math.cos(f*Math.PI/2);
      vIn=f<0.20?Math.sin((f/0.20)*0.52):Math.sin(((f-0.20)/0.80)*Math.PI/2+0.52);
      vIn=Math.min(1,vIn);
    } else {
      vOut=f<0.30?1:Math.cos(((f-0.30)/0.70)*Math.PI/2);
      const sig=1/(1+Math.exp(-12*(f-0.65)));
      vIn=sig;
    }
    dOut.preGain.gain.setValueAtTime(Math.max(0,vOut), tAt);
    dIn.preGain.gain.setValueAtTime(Math.max(0,vIn), tAt);
    if(style==='guetta'){
      if(f<0.60)dIn.hipass.frequency.setValueAtTime(320,tAt);
      else dIn.hipass.frequency.exponentialRampToValueAtTime(20,tAt);
      dOut.lopass.frequency.setValueAtTime(Math.max(400,20000*(1-f*1.2)),tAt);
    }else if(style==='avicii'){
      dOut.hipass.frequency.setValueAtTime(20+f*780,tAt);
    }else if(style==='fusion'){
      dOut.lopass.frequency.setValueAtTime(Math.max(2000,20000*(1-f*.5)),tAt);
    }
    const midBoost=style==='progressive'?1:1+Math.sin(f*Math.PI)*0.06;
    S.compGain.gain.setValueAtTime(midBoost,tAt);
  }
  dOut.preGain.gain.setValueAtTime(0, t0+cfDur);
  dIn.preGain.gain.setValueAtTime(1, t0+cfDur);
  setTimeout(async()=>{
    const prevDk=out;
    const d2=S.decks[prevDk];
    if(d2.src){d2.src.onended=null;try{d2.src.stop();}catch(e){}}
    S.deck=inp;
    S.cur=nxt; S.curFile=nxt.file;
    S.startAt=ctx.currentTime-enterAt-(ctx.currentTime-t0);
    S.startAt=S.decks[inp].startedAt;
    S.mixing=false; S.mixStyle=null;
    S.played.push(nxt.file); S.playedSet.add(nxt.file); S.count++;
    S.sessionTracks.push({track:nxt,startCtxTime:ctx.currentTime,color:trackColor(S.sessionTracks.length)});
    S.silenceStart=null; S.silenceTriggered=false;
    hideMixing();
    updateNP(nxt,''); renderLib(); renderTimeline();
    askNext(nxt,0);
  }, cfDur*1000+200);
}

// ── Main Loop ──────────────────────────────────────────────────
function loop() {
  if (!S.playing) return;
  requestAnimationFrame(loop);
  const t = getTime();
  const dur = S.cur ? (S.cur.duracion_segundos||0) : 0;

  // Progress bar (decorativa)
  if (dur > 0) {
    const pf = document.getElementById('progressFill');
    if (pf) pf.style.width = Math.min(100, (t/dur)*100) + '%';
  }

  document.getElementById('tCur').textContent = fmt(t);
  if (dur) document.getElementById('tTot').textContent = fmt(dur);

  // Beat detection
  if (S.mAnl) {
    const fbuf = new Uint8Array(S.mAnl.frequencyBinCount);
    S.mAnl.getByteFrequencyData(fbuf);
    const subEnd = Math.floor(fbuf.length * 0.05);
    let subE = 0;
    for(let i=0;i<subEnd;i++) subE += fbuf[i]/255;
    subE /= subEnd;
    S.beatHistory.push(subE);
    if(S.beatHistory.length>30) S.beatHistory.shift();
    const avg = S.beatHistory.reduce((a,b)=>a+b,0)/S.beatHistory.length;
    S.beatThresh = avg * 1.35 + 0.05;
    const now = ctx.currentTime;
    const minInterval = 0.25;
    if (subE > S.beatThresh && (now - S.beatLastTime) > minInterval) {
      S.beatLastTime = now;
      CV.lastBeat = now;
      // Beat pulse on title
      const tt = document.getElementById('npTitle');
      if(tt){ tt.classList.add('beat-pulse'); setTimeout(()=>tt.classList.remove('beat-pulse'),180); }
    }
    // Smooth energy
    let total=0;
    for(let i=0;i<fbuf.length;i++) total+=fbuf[i]/255;
    CV.smoothEnergy += ((total/fbuf.length) - CV.smoothEnergy) * 0.12;
    CV.rawFreq = fbuf;
  }

  // Mix progress
  if (S.mixing) {
    const elapsed = ctx.currentTime - S.mixStart;
    const frac = Math.min(1, elapsed / Math.max(S.mixDur,1));
    document.getElementById('mixFill').style.width = (frac*100)+'%';
    updateEQVisual(frac);
  }

  // Beat snap / trigger
  if (!S.mixing && S.playing && !S._beatSnapScheduled && S.nxt && S.nxtPlan && dur > 0) {
    const startMix = S.nxtPlan.start_current_time || (dur - (S.nxtPlan.mix_duration||8));
    if (t >= startMix - 0.3 && t < startMix + 3) {
      S._beatSnapScheduled = true;
      const delay = Math.max(0, (startMix - t) * 1000);
      setTimeout(()=>{ if(!S.mixing&&S.playing) doMix(); S._beatSnapScheduled=false; }, delay);
    }
  }
  if (!S.mixing && S.playing && dur > 0 && t >= dur - 0.5 && !S._beatSnapScheduled) {
    S._beatSnapScheduled = true;
    setTimeout(()=>{ if(!S.mixing&&S.playing) doMix(); S._beatSnapScheduled=false; }, Math.max(0,(dur-t)*1000));
  }
  if (S.count === 1 && !S.mixing && S.nxt && !S._beatSnapScheduled) askNext(S.cur, t);

  // Timeline head
  if (S.playing && S.sessionTracks.length > 0) {
    const elapsed = ctx.currentTime - S.sessionStartTime;
    const totalEst = S.sessionTracks.reduce((acc,st)=>acc+(st.track.duracion_segundos||180),0);
    const pct = Math.min(99,(elapsed/Math.max(totalEst,1))*100);
    const tlHead = document.getElementById('tlHead');
    if(tlHead) tlHead.style.left = pct+'%';
  }

  // Silence detection
  if (!S.mixing && S.playing && t > 5 && !(S._dragging && S._dragging())) {
    const dk = S.decks[S.deck];
    if (dk && dk.analyser) {
      const buf2 = new Uint8Array(dk.analyser.frequencyBinCount);
      dk.analyser.getByteFrequencyData(buf2);
      let sum=0;
      for(let i=0;i<buf2.length;i++) sum+=(buf2[i]/255)*(buf2[i]/255);
      const rms = Math.sqrt(sum/buf2.length);
      const progress = dur > 0 ? t/dur : 0;
      if(rms<0.03 && progress>0.30 && !S.silenceTriggered){
        if(S.silenceStart===null) S.silenceStart=ctx.currentTime;
        else if((ctx.currentTime-S.silenceStart)*1000>1800){
          S.silenceTriggered=true; S.silenceStart=null; doMix();
        }
      } else if(rms>=0.03){ S.silenceStart=null; S.silenceTriggered=false; }
    }
  }

  drawPopViz();
}

// ── EQ helpers ─────────────────────────────────────────────────
function updateEQVisual(frac) {
  const hiPct  = Math.max(0,(1-Math.pow(frac/0.8,0.6))*100);
  const midPct = Math.max(0,(1-Math.pow(frac/0.9,0.8))*100);
  const loPct  = Math.max(0,(1-Math.pow(frac/1.0,1.2))*100);
  document.getElementById('eqHi').style.width  = hiPct+'%';
  document.getElementById('eqMid').style.width = midPct+'%';
  document.getElementById('eqLo').style.width  = loPct+'%';
}
function hideEQ() {
  document.getElementById('eqRow').classList.remove('on');
  ['eqHi','eqMid','eqLo'].forEach(id=>document.getElementById(id).style.width='100%');
}

function updateNP(t, phase) {
  const titleEl = document.getElementById('npTitle');
  if(titleEl){ titleEl.style.animation='none'; void titleEl.offsetWidth; titleEl.style.animation='';
    titleEl.textContent = t.name; }
  const bpmEl = document.getElementById('npBpm');
  if(bpmEl) bpmEl.textContent = t.bpm ? t.bpm.toFixed(1)+' BPM' : '';
  const durEl = document.getElementById('npDur');
  if(durEl) durEl.textContent = t.duracion_segundos ? fmt(t.duracion_segundos) : '';
  const keyEl = document.getElementById('npKey');
  if(keyEl){ if(t.key){keyEl.textContent=t.key;keyEl.style.display='inline';}else keyEl.style.display='none'; }
  const estiloEl = document.getElementById('npEstilo');
  if(estiloEl){ if(t.estilo){estiloEl.textContent=t.estilo;estiloEl.style.display='inline';}else estiloEl.style.display='none'; }
  const bv = document.getElementById('bpmVal');
  if(bv) bv.textContent = t.bpm ? Math.round(t.bpm) : '—';
  const pill = document.getElementById('phasePill');
  const p = phase || S.nxtPhase || 'warm-up';
  if(pill){ pill.textContent = PHASE_LABELS[p]||p; pill.setAttribute('class','pill-'+p); }
  const egyEl = document.getElementById('npEgy');
  if(egyEl) egyEl.textContent = t.energia ? 'E'+t.energia : '';
  updateLikeUI(t.file);
}
function updateArc(phase, targetE) {
  const idx = PHASE_ORDER.indexOf(phase);
  const pct = idx<0?0:(idx/(PHASE_ORDER.length-1))*100;
  document.getElementById('arcCursor').style.left = pct+'%';
  document.getElementById('arcPhase').textContent = (PHASE_LABELS[phase]||phase)+' · E→'+Math.round(targetE);
}
function showNext(t, plan, score, phase) {
  document.getElementById('nxtRow').style.display = 'flex';
  document.getElementById('nxtNm').textContent = t.name;
  document.getElementById('nxtSc').textContent = 'Score '+Math.round(score);

function hideNext() { document.getElementById('nxtRow').style.display = 'none'; }
function showMixing(name, dur, style) {

S.prefs = {};
async function loadPrefs() {
  try { const r=await fetch('/api/prefs'); S.prefs=await r.json(); } catch(e){}
}
async function sendLike(action) {
  if (!S.cur) return;
  const file = S.cur.file;
  const current = S.prefs[file];
  const sendAction = (action==='like'&&current===1)||(action==='dislike'&&current===-1)?'clear':action;
  try {
    await fetch('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({file,action:sendAction})});
    if(sendAction==='like') S.prefs[file]=1;
    else if(sendAction==='dislike') S.prefs[file]=-1;
    else delete S.prefs[file];
    updateLikeUI(file);
    const titleEl = document.getElementById('npTitle');
    if(titleEl){
      const orig=titleEl.textContent;
      titleEl.textContent=sendAction==='like'?'👍 ¡Guardado!':sendAction==='dislike'?'👎 Anotado':'✓ Borrado';
      setTimeout(()=>{titleEl.textContent=orig;},1400);
    }
  } catch(e){}
}
function updateLikeUI(file) {
  const pref=S.prefs[file]||0;
  const bl=document.getElementById('btnLike');
  const bd=document.getElementById('btnDislike');
  if(bl) bl.classList.toggle('active-like',pref===1);
  if(bd) bd.classList.toggle('active-dislike',pref===-1);
}
function renderLib() {
  const list=document.getElementById('tlist');
  if(!S.lib.length){list.innerHTML='<div>Pon MP3/WAV en musica/canciones/</div>';return;}
  const cBpm=S.cur?(S.cur.bpm||0):0;
  list.innerHTML=S.lib.map((t,i)=>{
    const iC=t.file===S.curFile;
    const iN=S.nxt&&t.file===S.nxt.file;
    const done=!iC&&S.playedSet.has(t.file);
    const bOk=!cBpm||!t.bpm||Math.abs(t.bpm-cBpm)<=10;
    const sc=iN?Math.round(S.nxtScore):null;
    const sC=sc===null?'':sc>70?'hi':sc>40?'mi':'lo';
    return `<div class="tk ${iC?'cur':''} ${iN?'nxt':''} ${done?'done':''}">
      <div class="tn">${iC?'▶':iN?'→':done?'✓':i+1}</div>
      <div class="tt">${t.name}</div>
      <div class="tb ${bOk?'ok':'no'}">${t.bpm?t.bpm.toFixed(0)+'bpm':'—'}</div>
      <div class="ts ${sC}">${sc!==null?sc:'—'}</div>
    </div>`;
  }).join('');
}
function drawWave(buf, track) {
  const c=document.getElementById('wc'),dpr=devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=c.offsetHeight*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);
  const W=c.offsetWidth,H=c.offsetHeight,mid=H/2;
  const data=buf.getChannelData(0),step=Math.ceil(data.length/W);
  g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,'rgba(255,110,199,.08)');
  gr.addColorStop(.4,'rgba(255,110,199,.65)');
  gr.addColorStop(.6,'rgba(103,232,249,.55)');
  gr.addColorStop(1,'rgba(255,110,199,.08)');
  g.strokeStyle=gr;g.lineWidth=1;g.beginPath();
  for(let i=0;i<W;i++){
    let mn=1,mx=-1;
    for(let j=0;j<step;j++){const v=data[i*step+j]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
    g.moveTo(i,mid+mn*mid);g.lineTo(i,mid+mx*mid);
  }
  g.stroke();
}
function trackColor(idx) {
  const palette=['rgba(255,110,199','rgba(103,232,249','rgba(167,139,250','rgba(253,230,138',
    'rgba(52,211,153','rgba(251,146,60','rgba(236,72,153','rgba(99,102,241'];
  return palette[idx%palette.length];
}
function renderTimeline() {
  const wrap=document.getElementById('tlWrap');
  if(!wrap||!S.sessionTracks.length) return;
  wrap.style.display='block';
  const blocks=document.getElementById('tlBlocks');
  const labels=document.getElementById('tlLabels');
  const tlDur=document.getElementById('tlDur');
  const durations=S.sessionTracks.map(st=>st.track.duracion_segundos||180);
  const total=durations.reduce((a,b)=>a+b,0);
  blocks.innerHTML=S.sessionTracks.map((st,i)=>{
    const dur=st.track.duracion_segundos||180;
    const pct=(dur/total*100).toFixed(2);
    const isCur=st.track.file===S.curFile;
    const isDone=!isCur&&i<S.sessionTracks.length-1;
    return `<div class="tl-block ${isCur?'playing':''} ${isDone?'done':'future'}"
      style="width:${pct}%;background:${st.color},.08)"
      title="${st.track.name}">
      <div style="position:absolute;bottom:0;left:0;right:0;height:${30+(st.track.energia||50)*0.7}%;
        background:${st.color},.4);border-radius:2px 2px 0 0;pointer-events:none"></div>
    </div>`;
  }).join('');
  let leftPct=0;
  labels.innerHTML=S.sessionTracks.map((st,i)=>{
    const dur=st.track.duracion_segundos||180;
    const pct=dur/total*100;
    const mid=leftPct+pct/2;
    leftPct+=pct;
    const isCur=st.track.file===S.curFile;
    const name=st.track.name.length>12?st.track.name.slice(0,11)+'…':st.track.name;
    return `<span class="tl-lbl ${isCur?'cur':''}" style="left:${mid.toFixed(1)}%">${name}</span>`;
  }).join('');
  tlDur.textContent=`~${Math.floor(total/60)} min`;
}
function logMsg(m) { document.getElementById('log').textContent=m; }
function fmt(s) { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function resize() {
  ['viz','wc'].forEach(id=>{
    const c=document.getElementById(id);
    c.width=c.offsetWidth*(devicePixelRatio||1);
    c.height=c.offsetHeight*(devicePixelRatio||1);
  });
}
window.addEventListener('resize', resize); resize();

// ════════════════════════════════════════════════════════════════
//  POP VISUALS — Glassmorphic Synthwave Pop
//  3 modos rotativos: Esferas · Anillos · Constelación
// ════════════════════════════════════════════════════════════════
const CV = {
  smoothEnergy: 0,
  rawFreq: null,
  lastBeat: 0,
  mode: 0,            // 0=spheres, 1=rings, 2=constellation
  modeTimer: 0,
  MODE_DURATION: 35,  // segundos por modo
  // Spheres mode
  spheres: [],
  // Rings mode
  rings: [],
  // Constellation mode
  stars: [],
  constellLines: [],
  // Shared
  hue: 300,
  t: 0,
};

const MODE_NAMES = ['SPHERES','RINGS','CONSTELLATION'];

function initPopVisuals() {
  const pm = document.getElementById('vizMain');
  const pp = document.getElementById('particles');
  function resizeViz() {
    pm.width = pp.width = window.innerWidth*(devicePixelRatio||1);
    pm.height = pp.height = window.innerHeight*(devicePixelRatio||1);
    pm.style.width = pp.style.width = window.innerWidth+'px';
    pm.style.height = pp.style.height = window.innerHeight+'px';
  }
  window.addEventListener('resize', resizeViz); resizeViz();
  // Init spheres
  for(let i=0;i<18;i++) CV.spheres.push(mkSphere());
  // Init constellation stars
  for(let i=0;i<80;i++) CV.stars.push(mkConStar());
  CV.modeTimer = performance.now();
  document.getElementById('modeLabel').textContent = '— ' + MODE_NAMES[0] + ' —';
}

function mkSphere() {
  const W=window.innerWidth, H=window.innerHeight;
  const hues=[320,280,190,50,160,350];
  return {
    x: Math.random()*W, y: Math.random()*H,
    vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.6,
    r: 20+Math.random()*60, targetR: 20+Math.random()*60,
    hue: hues[Math.floor(Math.random()*hues.length)],
    phase: Math.random()*Math.PI*2,
    phaseSpeed: 0.005+Math.random()*0.01,
    opacity: 0.4+Math.random()*0.4,
  };
}

function mkConStar() {
  const W=window.innerWidth, H=window.innerHeight;
  return {
    x: Math.random()*W, y: Math.random()*H,
    size: 1+Math.random()*3,
    hue: 280+Math.random()*120,
    brightness: Math.random(),
    twinkle: Math.random()*Math.PI*2,
    twinkleSpeed: 0.015+Math.random()*0.03,
    vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
  };
}

// ── Background Liquid Gradient ──────────────────────────────────
let bgCtx = null;
let bgT = 0;
function initBgCanvas() {
  const c = document.getElementById('bgCanvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
  window.addEventListener('resize', ()=>{ c.width=window.innerWidth; c.height=window.innerHeight; });
  bgCtx = c.getContext('2d');
  animateBg();
}
function animateBg() {
  requestAnimationFrame(animateBg);
  bgT += 0.003;
  const W=bgCtx.canvas.width, H=bgCtx.canvas.height;
  bgCtx.clearRect(0,0,W,H);
  // Base dark
  bgCtx.fillStyle='#0a0010';
  bgCtx.fillRect(0,0,W,H);
  // Animated blobs
  const blobs=[
    {x:W*(0.3+0.15*Math.sin(bgT*0.7)),   y:H*(0.35+0.1*Math.cos(bgT*0.5)),  r:W*0.45, h:'rgba(255,100,200,'},
    {x:W*(0.65+0.12*Math.cos(bgT*0.6)),  y:H*(0.55+0.12*Math.sin(bgT*0.8)), r:W*0.4,  h:'rgba(140,80,255,'},
    {x:W*(0.5+0.18*Math.sin(bgT*0.4)),   y:H*(0.2+0.08*Math.cos(bgT*0.9)),  r:W*0.35, h:'rgba(80,220,255,'},
    {x:W*(0.2+0.1*Math.cos(bgT*0.9)),    y:H*(0.75+0.1*Math.sin(bgT*0.6)),  r:W*0.3,  h:'rgba(253,200,80,'},
  ];
  for(const b of blobs){
    const g=bgCtx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,b.h+'0.08)');
    g.addColorStop(0.5,b.h+'0.03)');
    g.addColorStop(1,'transparent');
    bgCtx.fillStyle=g; bgCtx.fillRect(0,0,W,H);
  }
}

// ── Main Pop Visualizer ─────────────────────────────────────────
function drawPopViz() {
  const pm = document.getElementById('vizMain');
  if (!pm) return;
  const gm = pm.getContext('2d');
  const W = pm.width, H = pm.height;
  const cx = W/2, cy = H/2;
  const dpr = devicePixelRatio||1;
  const now = performance.now();
  CV.t += 0.016;

  // Mode rotation
  const elapsed = (now - CV.modeTimer) / 1000;
  if (elapsed > CV.MODE_DURATION) {
    CV.mode = (CV.mode + 1) % 3;
    CV.modeTimer = now;
    const lbl = document.getElementById('modeLabel');
    if(lbl){ lbl.style.opacity=0; setTimeout(()=>{ lbl.textContent='— '+MODE_NAMES[CV.mode]+' —'; lbl.style.opacity=1; },500); }
  }

  const beatAge = ctx ? (ctx.currentTime - CV.lastBeat) : 99;
  const beatFlash = Math.max(0, 1 - beatAge * 4);
  const energy = CV.smoothEnergy;
  const freq = CV.rawFreq;

  gm.clearRect(0,0,W,H);

  // ── MODE 0: FLOATING SPHERES ────────────────────────────────
  if (CV.mode === 0) {
    // Sub bass energy for sphere sizing
    let subE = 0;
    if (freq) {
      const subEnd = Math.floor(freq.length*0.04);
      for(let i=0;i<subEnd;i++) subE += freq[i]/255;
      subE /= Math.max(subEnd,1);
    }

    for(const sp of CV.spheres) {
      sp.phase += sp.phaseSpeed;
      sp.x += sp.vx + Math.sin(sp.phase)*0.3;
      sp.y += sp.vy + Math.cos(sp.phase*0.7)*0.3;
      // Bounce
      if(sp.x < sp.r || sp.x > W/dpr - sp.r) sp.vx *= -1;
      if(sp.y < sp.r || sp.y > H/dpr - sp.r) sp.vy *= -1;
      sp.x = Math.max(sp.r, Math.min(W/dpr-sp.r, sp.x));
      sp.y = Math.max(sp.r, Math.min(H/dpr-sp.r, sp.y));
      // Grow on beat
      sp.targetR = sp.r + subE * 80 * (0.5 + Math.random()*0.5);
      sp.r += (sp.targetR - sp.r) * 0.08;
      sp.r = Math.max(15, Math.min(120, sp.r));
      const rx = sp.x * dpr, ry = sp.y * dpr, rr = sp.r * dpr;
      // Glassmorphic sphere
      const grad = gm.createRadialGradient(rx-rr*0.3, ry-rr*0.3, rr*0.05, rx, ry, rr);
      grad.addColorStop(0,  `hsla(${sp.hue},100%,92%,${sp.opacity*0.8})`);
      grad.addColorStop(0.3,`hsla(${sp.hue},90%,70%,${sp.opacity*0.6})`);
      grad.addColorStop(0.7,`hsla(${sp.hue},80%,50%,${sp.opacity*0.3})`);
      grad.addColorStop(1,  `hsla(${sp.hue},70%,30%,0)`);
      gm.beginPath(); gm.arc(rx, ry, rr, 0, Math.PI*2);
      gm.fillStyle = grad; gm.fill();
      // Glassy highlight
      const hl = gm.createRadialGradient(rx-rr*0.4, ry-rr*0.4, 0, rx-rr*0.2, ry-rr*0.2, rr*0.5);
      hl.addColorStop(0, `rgba(255,255,255,0.35)`);
      hl.addColorStop(1, 'transparent');
      gm.beginPath(); gm.arc(rx, ry, rr, 0, Math.PI*2);
      gm.fillStyle = hl; gm.fill();
      // Beat ring
      if(beatFlash > 0.1 && subE > 0.3){
        gm.strokeStyle = `hsla(${sp.hue},100%,80%,${beatFlash*0.4})`;
        gm.lineWidth = 2*dpr;
        gm.beginPath(); gm.arc(rx, ry, rr*(1+beatFlash*0.3), 0, Math.PI*2); gm.stroke();
      }
    }
    // Beat flash overlay
    if(beatFlash > 0.05){
      const fl = gm.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
      fl.addColorStop(0, `rgba(255,150,220,${beatFlash*0.06})`);
      fl.addColorStop(1, 'transparent');
      gm.fillStyle=fl; gm.fillRect(0,0,W,H);
    }
  }

  // ── MODE 1: CONCENTRIC WAVE RINGS ──────────────────────────
  else if (CV.mode === 1) {
    // Voice/mid frequencies
    let midE = 0, hiE = 0;
    if(freq){
      const midS=Math.floor(freq.length*0.1), midEnd=Math.floor(freq.length*0.35);
      for(let i=midS;i<midEnd;i++) midE += freq[i]/255;
      midE /= (midEnd-midS)||1;
      const hiS=Math.floor(freq.length*0.35);
      for(let i=hiS;i<freq.length;i++) hiE += freq[i]/255;
      hiE /= (freq.length-hiS)||1;
    }

    // Spawn new rings on beat
    if(beatFlash > 0.7 && CV.rings.length < 12){
      CV.rings.push({ r:0, maxR: Math.min(W,H)*0.55, speed: 2+midE*8, hue: 280+Math.random()*120,
        thickness: 1.5+midE*4, opacity: 0.8 });
    }
    // Passive rings
    if(CV.rings.length < 5){
      CV.rings.push({ r: Math.random()*Math.min(W,H)*0.2, maxR: Math.min(W,H)*0.55,
        speed: 1+midE*2, hue: 280+Math.random()*120, thickness: 1+midE*2, opacity: 0.3 });
    }
    // Update & draw rings
    CV.rings = CV.rings.filter(r => r.r < r.maxR);
    for(const r of CV.rings){
      r.r += r.speed * (1 + midE*3);
      const alpha = r.opacity * (1 - r.r/r.maxR);
      const thk = r.thickness * (1 + hiE*2) * dpr;
      // Organic wobble
      gm.beginPath();
      const segs = 128;
      for(let i=0;i<=segs;i++){
        const ang = (i/segs)*Math.PI*2;
        const wobble = 1 + (midE*0.15)*Math.sin(ang*6+CV.t*3) + (hiE*0.08)*Math.cos(ang*12+CV.t*5);
        const rx2 = cx + Math.cos(ang)*r.r*dpr*wobble;
        const ry2 = cy + Math.sin(ang)*r.r*dpr*wobble;
        if(i===0) gm.moveTo(rx2,ry2); else gm.lineTo(rx2,ry2);
      }
      gm.closePath();
      gm.strokeStyle = `hsla(${r.hue},100%,75%,${alpha})`;
      gm.lineWidth = thk;
      gm.stroke();
    }
    // Central glow
    const cg = gm.createRadialGradient(cx,cy,0,cx,cy,80*dpr*(1+energy));
    cg.addColorStop(0,`rgba(255,150,220,${0.12+energy*0.2})`);
    cg.addColorStop(0.5,`rgba(167,100,255,${0.06+energy*0.1})`);
    cg.addColorStop(1,'transparent');
    gm.fillStyle=cg; gm.fillRect(0,0,W,H);
  }

  // ── MODE 2: GEOMETRIC CONSTELLATION ────────────────────────
  else {
    // Percussion energy (high frequencies)
    let hiE = 0;
    if(freq){
      const hiS=Math.floor(freq.length*0.6);
      for(let i=hiS;i<freq.length;i++) hiE += freq[i]/255;
      hiE /= (freq.length-hiS)||1;
    }

    // Update stars
    for(const st of CV.stars){
      st.x += st.vx * (1+hiE*3);
      st.y += st.vy * (1+hiE*3);
      if(st.x<0||st.x>W/dpr) st.vx*=-1;
      if(st.y<0||st.y>H/dpr) st.vy*=-1;
      st.twinkle += st.twinkleSpeed;
    }

    // Draw connections
    const maxDist = 120 + energy*80;
    for(let i=0;i<CV.stars.length;i++){
      for(let j=i+1;j<CV.stars.length;j++){
        const dx=(CV.stars[i].x-CV.stars[j].x)*dpr;
        const dy=(CV.stars[i].y-CV.stars[j].y)*dpr;
        const dist=Math.sqrt(dx*dx+dy*dy)/dpr;
        if(dist<maxDist){
          const alpha=(1-dist/maxDist)*0.35*(1+hiE);
          const hue2=280+((i+j)%4)*30;
          gm.strokeStyle=`hsla(${hue2},90%,75%,${alpha})`;
          gm.lineWidth=(1-dist/maxDist)*2.5*dpr*(1+hiE*2);
          gm.beginPath();
          gm.moveTo(CV.stars[i].x*dpr,CV.stars[i].y*dpr);
          gm.lineTo(CV.stars[j].x*dpr,CV.stars[j].y*dpr);
          gm.stroke();
        }
      }
    }
    // Draw star points
    for(const st of CV.stars){
      const tw=0.5+0.5*Math.sin(st.twinkle);
      const brt=st.brightness*tw*(1+hiE*2);
      const sz=st.size*(1+hiE*3)*dpr;
      const sg=gm.createRadialGradient(st.x*dpr,st.y*dpr,0,st.x*dpr,st.y*dpr,sz*2);
      sg.addColorStop(0,`hsla(${st.hue},100%,90%,${brt})`);
      sg.addColorStop(1,'transparent');
      gm.fillStyle=sg;
      gm.beginPath();gm.arc(st.x*dpr,st.y*dpr,sz*2,0,Math.PI*2);gm.fill();
      gm.fillStyle=`hsla(${st.hue},100%,95%,${brt*0.8})`;
      gm.beginPath();gm.arc(st.x*dpr,st.y*dpr,sz*0.6,0,Math.PI*2);gm.fill();
    }
    // Beat flash
    if(beatFlash>0.1){
      for(let k=0;k<3;k++){
        const td=Math.max(0,beatFlash-k*0.1);
        gm.strokeStyle=`hsla(${300+k*30},100%,80%,${td*0.25})`;
        gm.lineWidth=(1-td)*3*dpr;
        gm.beginPath();gm.arc(cx,cy,td*Math.min(W,H)*0.45,0,Math.PI*2);gm.stroke();
      }
    }
  }
}

boot();
</script>
